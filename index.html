<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProductHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070d;--glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.07);--glass3:rgba(255,255,255,0.11);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#eeedf8;--text2:#b0afc8;--text3:#6e6d85;
  --p:#8b78ff;--p2:#b0a0ff;--p3:#5c4de6;--p-glow:rgba(139,120,255,0.35);--p-glow2:rgba(139,120,255,0.12);
  --g:#34d399;--g-bg:rgba(52,211,153,0.1);--g-border:rgba(52,211,153,0.25);
  --r:#f87171;--r-bg:rgba(248,113,113,0.1);--r-border:rgba(248,113,113,0.25);
  --a:#fbbf24;--a-bg:rgba(251,191,36,0.1);--a-border:rgba(251,191,36,0.25);
  --rad:12px;--rad-lg:18px;--rad-xl:24px;--shadow-lg:0 20px 60px rgba(0,0,0,0.6);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
#bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.screen{position:relative;z-index:1;display:none;min-height:100vh}
.screen.active{display:flex}

/* LANDING */
#landing{flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem}
.land-logo{font-family:'Syne',sans-serif;font-size:clamp(2.8rem,7vw,5rem);font-weight:800;line-height:1;letter-spacing:-0.04em;text-align:center;margin-bottom:.6rem;background:linear-gradient(135deg,#fff 0%,var(--p2) 50%,var(--p) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.land-sub{font-size:1rem;color:var(--text2);margin-bottom:3.5rem;text-align:center}
.role-wrap{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
.role-card{position:relative;width:230px;padding:2.4rem 2rem 2rem;border-radius:var(--rad-xl);background:var(--glass);border:1px solid var(--border2);cursor:pointer;text-align:center;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.role-card:hover{transform:translateY(-6px);border-color:var(--p);box-shadow:0 0 0 1px var(--p),var(--shadow-lg),0 0 60px var(--p-glow)}
.rc-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--p3),var(--p));display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:1.5rem;color:#fff;box-shadow:0 8px 24px var(--p-glow)}
.role-card h2{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:.4rem}
.role-card p{font-size:.82rem;color:var(--text3);line-height:1.5}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:rgba(16,14,28,0.98);border:1px solid var(--border2);border-radius:var(--rad-xl);padding:2.2rem 2rem;width:380px;max-width:92vw;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1.8rem}
.modal-head .icon-box{width:40px;height:40px;border-radius:10px;background:var(--p-glow2);border:1px solid rgba(139,120,255,0.3);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--p2)}
.modal-head h3{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.75rem;color:var(--text3);margin-bottom:.4rem;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:var(--rad);border:1px solid var(--border2);background:rgba(255,255,255,0.04);color:var(--text);font-size:.92rem;font-family:'DM Sans',sans-serif;outline:none;transition:border .15s,box-shadow .15s;appearance:none}
.field input:focus,.field select:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-glow2)}
.field select option{background:#0e0d1c;color:var(--text)}
.msg-error{color:var(--r);font-size:.82rem;margin-bottom:.8rem;padding:.6rem .9rem;background:var(--r-bg);border-radius:var(--rad);border:1px solid var(--r-border);display:none}
.msg-warn{color:var(--a);font-size:.82rem;margin-bottom:.8rem;padding:.6rem .9rem;background:var(--a-bg);border-radius:var(--rad);border:1px solid var(--a-border);display:none}
.modal-btns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.4rem}

/* BUTTONS */
.btn{padding:.55rem 1.25rem;border-radius:var(--rad);border:none;cursor:pointer;font-size:.88rem;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
.btn i{font-size:1rem}
.btn-primary{background:linear-gradient(135deg,var(--p3) 0%,var(--p) 100%);color:#fff;box-shadow:0 4px 16px var(--p-glow)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--glass2);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--border3);color:var(--text)}
.btn-danger{background:var(--r-bg);color:var(--r);border:1px solid var(--r-border)}
.btn-success{background:var(--g-bg);color:var(--g);border:1px solid var(--g-border)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px}

/* APP LAYOUT */
#manager-app,#customer-app{flex-direction:row}
.sidebar{width:230px;min-height:100vh;background:rgba(10,10,20,0.95);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.6rem 1rem;gap:.3rem;flex-shrink:0;position:sticky;top:0;height:100vh}
.sb-logo{padding:.4rem .7rem 1.6rem;border-bottom:1px solid var(--border);margin-bottom:.8rem}
.sb-logo-text{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-logo-role{font-size:.7rem;color:var(--text3);margin-top:2px;letter-spacing:.05em;text-transform:uppercase}
.sb-section{font-size:.65rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:.4rem .8rem;margin-top:.6rem;font-weight:600}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.62rem .8rem;border-radius:var(--rad);cursor:pointer;color:var(--text3);font-size:.88rem;transition:all .15s;border:none;background:none;width:100%;text-align:left;position:relative;font-family:'DM Sans',sans-serif}
.nav-item i{font-size:1.05rem;width:20px;text-align:center;flex-shrink:0}
.nav-item:hover{color:var(--text);background:var(--glass2)}
.nav-item.active{color:var(--p2);background:var(--p-glow2)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:var(--p)}
.nav-item.danger{color:var(--r)}
.nav-item.danger:hover{background:var(--r-bg)}
.sb-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:1rem}
.main{flex:1;padding:2.2rem;overflow-y:auto;max-height:100vh}

/* PAGE HEADER */
.ph{margin-bottom:2rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.ph-left h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.ph-left p{color:var(--text3);font-size:.85rem;margin-top:.3rem}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:2rem}
.stat{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad-lg);padding:1.4rem 1.2rem}
.stat-icon{width:36px;height:36px;border-radius:9px;background:var(--glass2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1rem;margin-bottom:1rem;color:var(--icon-c,var(--p2))}
.stat-label{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:.3rem}
.stat-val{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;color:var(--val-c,var(--text))}

/* CARDS / TABLES */
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad-lg);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border)}
.card-head h3{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700}
table{width:100%;border-collapse:collapse}
th{padding:.8rem 1.4rem;text-align:left;font-size:.7rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02)}
td{padding:.9rem 1.4rem;font-size:.88rem;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,0.03)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .65rem;border-radius:99px;font-size:.72rem;font-weight:600}
.badge-green{background:var(--g-bg);color:var(--g);border:1px solid var(--g-border)}
.badge-amber{background:var(--a-bg);color:var(--a);border:1px solid var(--a-border)}
.badge-red{background:var(--r-bg);color:var(--r);border:1px solid var(--r-border)}
.badge-purple{background:var(--p-glow2);color:var(--p2);border:1px solid rgba(139,120,255,0.3)}

/* FORMS */
.form-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad-lg);padding:2rem;max-width:500px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-actions{display:flex;gap:.6rem;margin-top:1.6rem}

/* PRODUCTS GRID */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.2rem}
.pcard{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad-lg);padding:1.5rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.pcard:hover{border-color:rgba(139,120,255,0.4);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.4)}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--p),transparent);opacity:0;transition:.2s}
.pcard:hover::before{opacity:1}
.pcard-pid{font-size:.7rem;color:var(--text3);font-weight:600;letter-spacing:.06em}
.pcard-name{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;line-height:1.2}
.pcard-price{font-family:'Syne',sans-serif;font-size:1.35rem;font-weight:800;color:var(--p2)}
.pcard-footer{margin-top:auto;display:flex;gap:.6rem;align-items:center}
.qty-ctrl{display:flex;align-items:center;gap:.35rem}
.qty-ctrl button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--glass2);color:var(--text);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:.12s;line-height:1}
.qty-ctrl button:hover{border-color:var(--p);color:var(--p2)}
.qty-ctrl span{font-size:.88rem;font-weight:700;min-width:22px;text-align:center}

/* CART */
.cart-badge{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--p);color:#fff;font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--bg)}
.cart-list{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.5rem}
.citem{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad);padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem}
.citem-info{flex:1;min-width:0}
.citem-name{font-weight:500;font-size:.92rem}
.citem-sub{font-size:.78rem;color:var(--text3);margin-top:2px}
.citem-total{font-family:'Syne',sans-serif;font-weight:800;color:var(--g);white-space:nowrap}
.bill-box{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad-lg);padding:1.8rem;max-width:480px}
.bill-row{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.88rem}
.bill-row:last-child{border-bottom:none}
.bill-total-row{display:flex;justify-content:space-between;padding:1rem 0 0;font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800}
.bill-total-row span:last-child{color:var(--g)}

/* ORDER CARDS */
.order-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--rad-lg);padding:1.8rem;margin-bottom:1.3rem}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.order-id{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800}
.order-meta{font-size:.78rem;color:var(--text3);margin-top:.2rem}
.order-customer{font-size:.82rem;color:var(--text2);margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}

/* EMPTY */
.empty{text-align:center;padding:5rem 2rem;color:var(--text3)}
.empty-icon{font-size:3.5rem;display:block;margin-bottom:1.2rem;opacity:.4}
.empty h3{font-family:'Syne',sans-serif;font-size:1.1rem;color:var(--text2);margin-bottom:.4rem}

/* LOADER */
.loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;gap:1rem}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:1.8rem;right:1.8rem;padding:.8rem 1.3rem;border-radius:var(--rad);font-size:.85rem;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .28s;pointer-events:none;display:flex;align-items:center;gap:.5rem}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:rgba(52,211,153,0.15);color:var(--g);border:1px solid var(--g-border)}
#toast.error{background:rgba(248,113,113,0.15);color:var(--r);border:1px solid var(--r-border)}
#toast.info{background:var(--p-glow2);color:var(--p2);border:1px solid rgba(139,120,255,0.3)}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<!-- LANDING -->
<div id="landing" class="screen active">
  <div class="land-logo">ProductHub</div>
  <p class="land-sub">Inventory & Sales Management System</p>
  <div class="role-wrap">
    <div class="role-card" onclick="enterRole('manager')">
      <div class="rc-icon"><i class="ti ti-shield-lock"></i></div>
      <h2>Product Manager</h2>
      <p>Add, update, and manage inventory</p>
    </div>
    <div class="role-card" onclick="enterRole('customer')">
      <div class="rc-icon" style="background:linear-gradient(135deg,#0e7a5e,var(--g))"><i class="ti ti-shopping-bag"></i></div>
      <h2>Customer</h2>
      <p>Browse products and place orders</p>
    </div>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal-bg" id="pwd-modal">
  <div class="modal">
    <div class="modal-head"><div class="icon-box"><i class="ti ti-lock"></i></div><h3>Manager Login</h3></div>
    <div class="field"><label>Password</label>
      <input type="password" id="pwd-input" placeholder="Enter password…" onkeydown="if(event.key==='Enter')checkPwd()"/>
    </div>
    <div id="pwd-error" class="msg-error"></div>
    <div id="pwd-lockout" class="msg-warn"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closePwdModal()">Cancel</button>
      <button class="btn btn-primary" onclick="checkPwd()"><i class="ti ti-login"></i> Login</button>
    </div>
  </div>
</div>

<!-- MANAGER APP -->
<div id="manager-app" class="screen">
  <div class="sidebar">
    <div class="sb-logo"><div class="sb-logo-text">ProductHub</div><div class="sb-logo-role">Manager Panel</div></div>
    <div class="sb-section">Navigation</div>
    <button class="nav-item active" onclick="navMgr('dashboard',this)"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
    <button class="nav-item" onclick="navMgr('products',this)"><i class="ti ti-package"></i>Products</button>
    <button class="nav-item" onclick="navMgr('add',this)"><i class="ti ti-circle-plus"></i>Add Product</button>
    <button class="nav-item" onclick="navMgr('staff',this)"><i class="ti ti-users"></i>Staff</button>
    <div class="sb-section">Orders</div>
    <button class="nav-item" onclick="navMgr('allorders',this)"><i class="ti ti-receipt"></i>All Orders</button>
    <div class="sb-bottom">
      <button class="nav-item danger" onclick="goHome()"><i class="ti ti-logout"></i>Logout</button>
    </div>
  </div>
  <div class="main" id="mgr-main"></div>
</div>

<!-- CUSTOMER APP -->
<div id="customer-app" class="screen">
  <div class="sidebar">
    <div class="sb-logo"><div class="sb-logo-text">ProductHub</div><div class="sb-logo-role">Customer Portal</div></div>
    <div class="sb-section">Menu</div>
    <button class="nav-item active" id="nav-shop" onclick="navCust('shop',this)"><i class="ti ti-shopping-cart"></i>Shop</button>
    <button class="nav-item" id="nav-cart" onclick="navCust('cart',this)" style="position:relative"><i class="ti ti-basket"></i>My Cart</button>
    <button class="nav-item" id="nav-orders" onclick="navCust('orders',this)"><i class="ti ti-receipt"></i>My Orders</button>
    <div class="sb-bottom">
      <button class="nav-item danger" onclick="goHome()"><i class="ti ti-logout"></i>Exit</button>
    </div>
  </div>
  <div class="main" id="cust-main"></div>
</div>

<div id="toast"></div>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const API = '';  // same origin - served by express
let cart = {};
let myOrders = [];
let lockTimer = null;
let lockRemaining = 0;
let staffCache = null;

// ── Background ─────────────────────────────────────────────────────────────
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H,orbs=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  function init(){orbs=[{x:W*.15,y:H*.2,r:300,vx:.15,vy:.08,col:'rgba(92,77,230,0.07)'},{x:W*.8,y:H*.6,r:250,vx:-.12,vy:.1,col:'rgba(139,120,255,0.06)'},{x:W*.5,y:H*.85,r:200,vx:.1,vy:-.12,col:'rgba(52,211,153,0.05)'}]}
  function draw(){ctx.clearRect(0,0,W,H);orbs.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.x<-o.r||o.x>W+o.r)o.vx*=-1;if(o.y<-o.r||o.y>H+o.r)o.vy*=-1;const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,o.col);g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill()});requestAnimationFrame(draw)}
  window.addEventListener('resize',()=>{resize();init()});resize();init();draw();
})();

// ── Helpers ─────────────────────────────────────────────────────────────────
const fmt = n => '₹' + Number(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  const icons={success:'ti-circle-check',error:'ti-alert-circle',info:'ti-info-circle'};
  t.innerHTML=`<i class="ti ${icons[type]||icons.info}"></i> ${msg}`;
  t.className=`toast ${type} show`;
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.className='toast',3200);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){cart={};myOrders=[];staffCache=null;showScreen('landing');}
function loader(){return`<div class="loader-wrap"><div class="spinner"></div><span style="color:var(--text3);font-size:.85rem">Loading…</span></div>`;}

// ── API ─────────────────────────────────────────────────────────────────────
async function api(method,path,body){
  try{
    const opts={method,headers:{'Content-Type':'application/json'}};
    if(body) opts.body=JSON.stringify(body);
    const res=await fetch('/api'+path,opts);
    return await res.json();
  }catch(e){
    toast('Cannot reach server — is Node.js running?','error');
    return null;
  }
}

// ── Landing ──────────────────────────────────────────────────────────────────
function enterRole(role){
  if(role==='manager') openPwdModal();
  else{
    showScreen('customer-app');
    setActiveNav('nav-shop');
    loadCustPage('shop');
  }
}

// ── Auth ─────────────────────────────────────────────────────────────────────
function openPwdModal(){
  document.getElementById('pwd-modal').classList.add('open');
  document.getElementById('pwd-input').value='';
  document.getElementById('pwd-input').disabled=false;
  document.getElementById('pwd-error').style.display='none';
  document.getElementById('pwd-lockout').style.display='none';
  setTimeout(()=>document.getElementById('pwd-input').focus(),100);
}
function closePwdModal(){document.getElementById('pwd-modal').classList.remove('open');clearInterval(lockTimer);}

async function checkPwd(){
  if(document.getElementById('pwd-input').disabled) return;
  const password=document.getElementById('pwd-input').value;
  const data=await api('POST','/auth/login',{password});
  if(!data) return;
  if(data.success){
    closePwdModal();
    showScreen('manager-app');
    document.querySelectorAll('#manager-app .nav-item').forEach(b=>b.classList.remove('active'));
    document.querySelector('#manager-app .nav-item').classList.add('active');
    loadMgrPage('dashboard');
    toast('Welcome back, Manager!','success');
  } else if(data.locked){
    document.getElementById('pwd-error').style.display='none';
    const lockEl=document.getElementById('pwd-lockout');
    lockEl.textContent=data.message;lockEl.style.display='block';
    document.getElementById('pwd-input').disabled=true;
    lockRemaining=60;
    lockTimer=setInterval(()=>{
      lockRemaining--;
      if(lockRemaining<=0){clearInterval(lockTimer);lockEl.style.display='none';document.getElementById('pwd-input').disabled=false;document.getElementById('pwd-input').focus();}
      else lockEl.textContent=`Too many attempts! Locked for ${lockRemaining}s…`;
    },1000);
  } else {
    const errEl=document.getElementById('pwd-error');
    errEl.textContent=data.message;errEl.style.display='block';
    document.getElementById('pwd-input').value='';
  }
}

// ── Manager ──────────────────────────────────────────────────────────────────
function navMgr(page,btn){
  document.querySelectorAll('#manager-app .nav-item').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('mgr-main').innerHTML=loader();
  setTimeout(()=>loadMgrPage(page),50);
}

async function loadMgrPage(page){
  const el=document.getElementById('mgr-main');
  if(page==='dashboard') el.innerHTML=await buildDashboard();
  else if(page==='products') el.innerHTML=await buildProducts();
  else if(page==='add') el.innerHTML=buildAddForm();
  else if(page==='staff') el.innerHTML=await buildStaff();
  else if(page==='allorders') el.innerHTML=await buildAllOrders();
}

async function buildDashboard(){
  const [stats,products]=await Promise.all([api('GET','/stats'),api('GET','/products')]);
  if(!stats||!products) return`<div class="empty"><span class="empty-icon"><i class="ti ti-wifi-off"></i></span><h3>Cannot reach server</h3><p>Make sure Node.js is running on port 3000.</p></div>`;
  return`
  <div class="ph"><div class="ph-left"><h1>Dashboard</h1><p>Live inventory overview</p></div></div>
  <div class="stats">
    <div class="stat" style="--icon-c:var(--p2);--val-c:var(--p2)"><div class="stat-icon"><i class="ti ti-package"></i></div><div class="stat-label">Products</div><div class="stat-val">${stats.totalProducts}</div></div>
    <div class="stat" style="--icon-c:var(--g);--val-c:var(--g)"><div class="stat-icon"><i class="ti ti-chart-bar"></i></div><div class="stat-label">Inventory Value</div><div class="stat-val" style="font-size:1.1rem">${fmt(stats.inventoryValue)}</div></div>
    <div class="stat" style="--icon-c:var(--a);--val-c:var(--a)"><div class="stat-icon"><i class="ti ti-alert-triangle"></i></div><div class="stat-label">Low Stock</div><div class="stat-val">${stats.lowStock}</div></div>
    <div class="stat" style="--icon-c:var(--g);--val-c:var(--g)"><div class="stat-icon"><i class="ti ti-receipt"></i></div><div class="stat-label">Orders</div><div class="stat-val">${stats.totalOrders}</div></div>
    <div class="stat" style="--icon-c:var(--g);--val-c:var(--g)"><div class="stat-icon"><i class="ti ti-coin-rupee"></i></div><div class="stat-label">Revenue</div><div class="stat-val" style="font-size:1.1rem">${fmt(stats.totalRevenue)}</div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-users"></i></div><div class="stat-label">Staff</div><div class="stat-val">${stats.staffCount}</div></div>
  </div>
  <div class="card"><div class="card-head"><h3>Product Inventory</h3></div>
  <table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Qty</th><th>Value</th><th>Status</th></tr></thead><tbody>
  ${Object.entries(products).map(([id,p])=>`<tr>
    <td style="color:var(--text3);font-size:.75rem;font-weight:700">${esc(id)}</td>
    <td style="font-weight:500">${esc(p.name)}</td><td>${fmt(p.price)}</td><td>${p.quantity}</td><td>${fmt(p.price*p.quantity)}</td>
    <td>${p.quantity<=0?'<span class="badge badge-red">Out</span>':p.quantity<=10?'<span class="badge badge-amber">Low</span>':'<span class="badge badge-green">OK</span>'}</td>
  </tr>`).join('')}
  </tbody></table></div>`;
}

async function buildProducts(){
  const products=await api('GET','/products');
  if(!products) return'';
  return`
  <div class="ph"><div class="ph-left"><h1>Manage Products</h1><p>Edit or remove products</p></div></div>
  <div class="card"><table>
  <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>
  ${Object.entries(products).map(([id,p])=>`<tr>
    <td style="color:var(--text3);font-size:.75rem;font-weight:700">${esc(id)}</td>
    <td style="font-weight:500">${esc(p.name)}</td><td>${fmt(p.price)}</td><td>${p.quantity}</td>
    <td>${p.quantity<=0?'<span class="badge badge-red">Out</span>':p.quantity<=10?'<span class="badge badge-amber">Low</span>':'<span class="badge badge-green">OK</span>'}</td>
    <td style="display:flex;gap:.5rem">
      <button class="btn btn-ghost btn-sm" onclick="openEditModal('${esc(id)}','${esc(p.name)}',${p.price},${p.quantity})"><i class="ti ti-edit"></i> Edit</button>
      <button class="btn btn-danger btn-sm" onclick="delProduct('${esc(id)}')"><i class="ti ti-trash"></i></button>
    </td>
  </tr>`).join('')}
  </tbody></table></div>
  <div class="modal-bg" id="edit-modal">
    <div class="modal">
      <div class="modal-head"><div class="icon-box"><i class="ti ti-edit"></i></div><h3>Edit Product</h3></div>
      <input type="hidden" id="e-id"/>
      <div class="field"><label>Name</label><input id="e-name"/></div>
      <div class="form-row">
        <div class="field"><label>Price (₹)</label><input id="e-price" type="number"/></div>
        <div class="field"><label>Quantity</label><input id="e-qty" type="number"/></div>
      </div>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="document.getElementById('edit-modal').classList.remove('open')">Cancel</button>
        <button class="btn btn-primary" onclick="saveEdit()"><i class="ti ti-check"></i> Save</button>
      </div>
    </div>
  </div>`;
}
function openEditModal(id,name,price,qty){
  document.getElementById('e-id').value=id;document.getElementById('e-name').value=name;
  document.getElementById('e-price').value=price;document.getElementById('e-qty').value=qty;
  document.getElementById('edit-modal').classList.add('open');
}
async function saveEdit(){
  const id=document.getElementById('e-id').value;
  const data=await api('PUT',`/products/${id}`,{name:document.getElementById('e-name').value,price:+document.getElementById('e-price').value,quantity:+document.getElementById('e-qty').value});
  if(data?.success){document.getElementById('edit-modal').classList.remove('open');navMgr('products',null);toast('Product updated!','success');}
  else toast(data?.message||'Error','error');
}
async function delProduct(id){
  if(!confirm(`Delete product ${id}?`)) return;
  const data=await api('DELETE',`/products/${id}`);
  if(data?.success){navMgr('products',null);toast(data.message,'info');}
  else toast(data?.message||'Error','error');
}

function buildAddForm(){
  return`
  <div class="ph"><div class="ph-left"><h1>Add Product</h1><p>Register a new item</p></div></div>
  <div class="form-card">
    <div class="field"><label>Product Name</label><input id="a-name" placeholder="e.g. Mechanical Keyboard"/></div>
    <div class="form-row">
      <div class="field"><label>Price (₹)</label><input id="a-price" type="number" min="0" placeholder="0"/></div>
      <div class="field"><label>Quantity</label><input id="a-qty" type="number" min="0" placeholder="0"/></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addProduct()"><i class="ti ti-circle-plus"></i> Add Product</button>
    </div>
  </div>`;
}
async function addProduct(){
  const name=document.getElementById('a-name').value.trim();
  const price=+document.getElementById('a-price').value;
  const quantity=+document.getElementById('a-qty').value;
  if(!name||isNaN(price)||isNaN(quantity)){toast('Fill in all fields!','error');return;}
  const data=await api('POST','/products',{name,price,quantity});
  if(data?.success){document.getElementById('a-name').value='';document.getElementById('a-price').value='';document.getElementById('a-qty').value='';toast(`${data.id} — "${name}" added!`,'success');}
  else toast(data?.message||'Error','error');
}

async function buildStaff(){
  const staff=await api('GET','/staff');
  if(!staff) return'';
  return`
  <div class="ph"><div class="ph-left"><h1>Staff</h1><p>Current team members</p></div></div>
  <div class="card"><table><thead><tr><th>Staff ID</th><th>Name</th></tr></thead><tbody>
  ${Object.entries(staff).map(([id,name])=>`<tr><td><span class="badge badge-purple">${esc(id)}</span></td><td style="font-weight:500"><i class="ti ti-user" style="color:var(--p2);margin-right:.5rem"></i>${esc(name)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

async function buildAllOrders(){
  const orders=await api('GET','/orders');
  if(!orders) return'';
  if(!orders.length) return`<div class="ph"><div class="ph-left"><h1>All Orders</h1></div></div><div class="empty"><span class="empty-icon"><i class="ti ti-receipt-off"></i></span><h3>No orders yet</h3></div>`;
  return`<div class="ph"><div class="ph-left"><h1>All Orders</h1><p>${orders.length} order(s)</p></div></div>${[...orders].reverse().map(renderOrderCard).join('')}`;
}

function renderOrderCard(o){
  return`<div class="order-card">
    <div class="order-head"><div><div class="order-id">${esc(o.id)}</div><div class="order-meta">${new Date(o.date).toLocaleString('en-IN')}</div></div><span class="badge badge-green"><i class="ti ti-check"></i> Confirmed</span></div>
    <div class="order-customer"><i class="ti ti-user" style="color:var(--p2);margin-right:.4rem"></i>${esc(o.customer)} &nbsp;·&nbsp; ${esc(o.staffName||o.staffId)}</div>
    ${o.items.map(i=>`<div class="bill-row"><span>${esc(i.name)} × ${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}
    <div class="bill-total-row"><span>Total Paid</span><span>${fmt(o.total)}</span></div>
  </div>`;
}

// ── Customer ──────────────────────────────────────────────────────────────────
function setActiveNav(id){
  document.querySelectorAll('#customer-app .nav-item').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}

function updateCartBadge(){
  const nav=document.getElementById('nav-cart');
  const old=nav.querySelector('.cart-badge');
  if(old) old.remove();
  const count=Object.values(cart).reduce((s,v)=>s+v,0);
  if(count>0) nav.insertAdjacentHTML('beforeend',`<span class="cart-badge">${count}</span>`);
}

async function loadCustPage(page){
  const el=document.getElementById('cust-main');
  el.innerHTML=loader();
  if(page==='shop') el.innerHTML=await buildShop();
  else if(page==='cart') el.innerHTML=await buildCart();
  else if(page==='orders') el.innerHTML=buildMyOrders();
  updateCartBadge();
}

function navCust(page,btn){
  setActiveNav(btn ? btn.id : null);
  loadCustPage(page);
}

// ── Shop ──────────────────────────────────────────────────────────────────────
async function buildShop(){
  const products=await api('GET','/products');
  if(!products) return`<div class="empty"><span class="empty-icon"><i class="ti ti-wifi-off"></i></span><h3>Cannot reach server</h3><p>Make sure Node.js is running.</p></div>`;
  const cartCount=Object.values(cart).reduce((s,v)=>s+v,0);
  return`
  <div class="ph">
    <div class="ph-left"><h1>Shop</h1><p>Browse and add items to your cart</p></div>
    <button class="btn btn-ghost" style="position:relative" onclick="setActiveNav('nav-cart');loadCustPage('cart')">
      <i class="ti ti-basket"></i> Cart ${cartCount>0?`<span class="cart-badge" style="position:relative;top:auto;right:auto;margin-left:.3rem">${cartCount}</span>`:''}
    </button>
  </div>
  <div class="product-grid">
  ${Object.entries(products).map(([id,p])=>{
    const qty=cart[id]||0;
    const inStock=p.quantity>0;
    return`<div class="pcard">
      <div class="pcard-pid">${esc(id)}</div>
      <div class="pcard-name">${esc(p.name)}</div>
      <div class="pcard-price">${fmt(p.price)}</div>
      <div>${inStock?`<span class="badge badge-green"><i class="ti ti-box"></i>${p.quantity} in stock</span>`:'<span class="badge badge-red">Out of stock</span>'}</div>
      <div class="pcard-footer">
        ${inStock?`
          <div class="qty-ctrl">
            <button onclick="changeCart('${esc(id)}',-1,${p.quantity})">&minus;</button>
            <span>${qty}</span>
            <button onclick="changeCart('${esc(id)}',1,${p.quantity})">+</button>
          </div>
          <button class="btn btn-success btn-sm" style="margin-left:auto" onclick="addToCart('${esc(id)}',${p.quantity})"><i class="ti ti-cart-plus"></i> Add</button>
        `:'<span style="color:var(--text3);font-size:.8rem">Unavailable</span>'}
      </div>
    </div>`;
  }).join('')}
  </div>`;
}

function changeCart(id,delta,max){
  const cur=cart[id]||0;
  const nv=cur+delta;
  if(nv<=0) delete cart[id];
  else if(nv>max){toast('Not enough stock!','error');return;}
  else cart[id]=nv;
  setActiveNav('nav-shop');
  loadCustPage('shop');
}

function addToCart(id,max){
  const cur=cart[id]||0;
  if(cur+1>max){toast('Not enough stock!','error');return;}
  cart[id]=cur+1;
  toast('Added to cart!','success');
  updateCartBadge();
  setActiveNav('nav-shop');
  loadCustPage('shop');
}

// ── Cart ──────────────────────────────────────────────────────────────────────
async function buildCart(){
  const products=await api('GET','/products');
  if(!products) return`<div class="empty"><span class="empty-icon"><i class="ti ti-wifi-off"></i></span><h3>Cannot reach server</h3></div>`;
  const keys=Object.keys(cart).filter(k=>products[k]);
  if(!keys.length) return`<div class="ph"><div class="ph-left"><h1>My Cart</h1></div></div><div class="empty"><span class="empty-icon"><i class="ti ti-basket-off"></i></span><h3>Cart is empty</h3><p>Go to Shop to add items.</p></div>`;

  if(!staffCache) staffCache=await api('GET','/staff');
  const staff=staffCache||{};
  const total=keys.reduce((s,k)=>s+cart[k]*products[k].price,0);

  return`
  <div class="ph"><div class="ph-left"><h1>My Cart</h1><p>${keys.length} item type(s)</p></div></div>
  <div class="cart-list">
  ${keys.map(k=>`<div class="citem">
    <div class="citem-info"><div class="citem-name">${esc(products[k].name)}</div><div class="citem-sub">${fmt(products[k].price)} each</div></div>
    <div class="qty-ctrl">
      <button onclick="cartQty('${esc(k)}',-1,${products[k].quantity})">&minus;</button>
      <span>${cart[k]}</span>
      <button onclick="cartQty('${esc(k)}',1,${products[k].quantity})">+</button>
    </div>
    <div class="citem-total">${fmt(cart[k]*products[k].price)}</div>
    <button class="btn btn-danger btn-icon" onclick="removeCart('${esc(k)}')"><i class="ti ti-x"></i></button>
  </div>`).join('')}
  </div>
  <div class="bill-box">
    <div class="field"><label>Staff Member</label>
      <select id="c-staff">
        <option value="">-- Select staff --</option>
        ${Object.entries(staff).map(([id,n])=>`<option value="${id}">${esc(n)} (${id})</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Your Name</label><input id="c-name" placeholder="Enter your name…"/></div>
    <div class="bill-total-row" style="margin-bottom:1.5rem"><span>Total</span><span>${fmt(total)}</span></div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="checkout()"><i class="ti ti-credit-card"></i> Checkout</button>
      <button class="btn btn-danger" onclick="clearCart()"><i class="ti ti-trash"></i> Clear</button>
    </div>
  </div>`;
}

function cartQty(id,delta,max){
  const cur=cart[id]||0;
  const nv=cur+delta;
  if(nv<=0) delete cart[id];
  else if(nv>max){toast('Not enough stock!','error');return;}
  else cart[id]=nv;
  setActiveNav('nav-cart');
  loadCustPage('cart');
}
function removeCart(id){delete cart[id];setActiveNav('nav-cart');loadCustPage('cart');}
function clearCart(){cart={};setActiveNav('nav-shop');loadCustPage('shop');}

async function checkout(){
  const staffId=document.getElementById('c-staff').value;
  const customer=document.getElementById('c-name').value.trim();
  if(!staffId){toast('Select a staff member!','error');return;}
  if(!customer){toast('Enter your name!','error');return;}
  const items=Object.entries(cart).map(([id,qty])=>({id,qty}));
  const data=await api('POST','/orders',{customer,staffId,items});
  if(data?.success){
    myOrders.push(data.order);cart={};staffCache=null;
    setActiveNav('nav-orders');loadCustPage('orders');
    toast('Order placed successfully!','success');
  } else toast(data?.message||'Checkout failed','error');
}

// ── Orders ────────────────────────────────────────────────────────────────────
function buildMyOrders(){
  if(!myOrders.length) return`<div class="ph"><div class="ph-left"><h1>My Orders</h1></div></div><div class="empty"><span class="empty-icon"><i class="ti ti-receipt-off"></i></span><h3>No orders yet</h3><p>Complete a purchase to see history.</p></div>`;
  return`<div class="ph"><div class="ph-left"><h1>My Orders</h1><p>${myOrders.length} order(s)</p></div></div>${[...myOrders].reverse().map(renderOrderCard).join('')}`;
}
</script>
</body>
</html>
