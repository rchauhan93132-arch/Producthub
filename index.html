<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProductHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg-canvas"></canvas>

<!-- LANDING -->
<div id="landing" class="screen active">
  <div class="land-logo">ProductHub</div>
  <p class="land-sub">Inventory & Sales Management System</p>
  <div class="role-wrap">
    <div class="role-card" onclick="enterRole('manager')">
      <div class="rc-icon"><i class="ti ti-shield-lock"></i></div>
      <h2>Product Manager</h2>
      <p>Add, update, and manage inventory</p>
    </div>
    <div class="role-card" onclick="enterRole('customer')">
      <div class="rc-icon" style="background:linear-gradient(135deg,#0e7a5e,var(--g))"><i class="ti ti-shopping-bag"></i></div>
      <h2>Customer</h2>
      <p>Browse products and place orders</p>
    </div>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal-bg" id="pwd-modal">
  <div class="modal">
    <div class="modal-head"><div class="icon-box"><i class="ti ti-lock"></i></div><h3>Manager Login</h3></div>
    <div class="field"><label>Password</label>
      <input type="password" id="pwd-input" placeholder="Enter password…" onkeydown="if(event.key==='Enter')checkPwd()"/>
    </div>
    <div id="pwd-error" class="msg-error"></div>
    <div id="pwd-lockout" class="msg-warn"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closePwdModal()">Cancel</button>
      <button class="btn btn-primary" onclick="checkPwd()"><i class="ti ti-login"></i> Login</button>
    </div>
  </div>
</div>

<!-- MANAGER APP -->
<div id="manager-app" class="screen">
  <div class="sidebar">
    <div class="sb-logo"><div class="sb-logo-text">ProductHub</div><div class="sb-logo-role">Manager Panel</div></div>
    <div class="sb-section">Navigation</div>
    <button class="nav-item active" onclick="navMgr('dashboard',this)"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
    <button class="nav-item" onclick="navMgr('products',this)"><i class="ti ti-package"></i>Products</button>
    <button class="nav-item" onclick="navMgr('add',this)"><i class="ti ti-circle-plus"></i>Add Product</button>
    <button class="nav-item" onclick="navMgr('staff',this)"><i class="ti ti-users"></i>Staff</button>
    <div class="sb-section">Orders</div>
    <button class="nav-item" onclick="navMgr('allorders',this)"><i class="ti ti-receipt"></i>All Orders</button>
    <div class="sb-bottom">
      <button class="nav-item danger" onclick="goHome()"><i class="ti ti-logout"></i>Logout</button>
    </div>
  </div>
  <div class="main" id="mgr-main"></div>
</div>

<!-- CUSTOMER APP -->
<div id="customer-app" class="screen">
  <div class="sidebar">
    <div class="sb-logo"><div class="sb-logo-text">ProductHub</div><div class="sb-logo-role">Customer Portal</div></div>
    <div class="sb-section">Menu</div>
    <button class="nav-item active" id="nav-shop" onclick="navCust('shop',this)"><i class="ti ti-shopping-cart"></i>Shop</button>
    <button class="nav-item" id="nav-cart" onclick="navCust('cart',this)" style="position:relative"><i class="ti ti-basket"></i>My Cart</button>
    <button class="nav-item" id="nav-orders" onclick="navCust('orders',this)"><i class="ti ti-receipt"></i>My Orders</button>
    <div class="sb-bottom">
      <button class="nav-item danger" onclick="goHome()"><i class="ti ti-logout"></i>Exit</button>
    </div>
  </div>
  <div class="main" id="cust-main"></div>
</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
